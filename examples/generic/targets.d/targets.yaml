# One target per compose service. The first three carry no weight and go in
# wave 0; the other three carry weight and go in wave 1.

# Unique across every targets file.
- id: app1/web
  # The machine it runs on. Targets on the same node share its weight and
  # move in the same batch when they can.
  node: app1
  # For people and hooks; rolloor does not connect to it.
  address: 127.0.0.1
  # This node's share of what the disruption budget protects. Zero never
  # uses the budget.
  weight: 0
  # repository:tag. rolloor follows the tag's digest.
  image: localhost:5050/app:latest
  labels:
    # The group label: one rollout moves every target with the same value.
    app: web
    # The owner label: who may act on this target.
    owner: team
    # The section label, for fleet page headings.
    tier: edge
    # Lower waves update first.
    wave: "0"
  # Opaque to rolloor; handed to every hook program.
  extra:
    service: app1
    port: "18081"

- id: app2/web
  node: app2
  address: 127.0.0.1
  weight: 0
  image: localhost:5050/app:latest
  labels:
    app: web
    owner: team
    tier: edge
    wave: "0"
  extra:
    service: app2
    port: "18082"

