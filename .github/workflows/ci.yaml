name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: modules are tidy
        run: |
          go mod tidy
          go mod verify
          git diff --exit-code go.mod go.sum
      - name: workload words stay out of the repository
        run: ./scripts/lint-words.sh
      - name: tests with coverage floors
        run: ./scripts/coverage.sh
      - name: build
        run: make build
      - name: vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

  generic-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: the whole loop against plain docker containers
        run: ./examples/generic/run.sh
      - name: controller log
        if: always()
        run: cat /tmp/rolloor-example/rolloor.log || true

  kurtosis-example:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: install kurtosis
        run: |
          echo "deb [trusted=yes] https://apt.fury.io/kurtosis-tech/ /" | sudo tee /etc/apt/sources.list.d/kurtosis.list
          sudo apt-get update
          sudo apt-get install -y kurtosis-cli
          kurtosis analytics disable
          kurtosis engine start
      - name: four nodes in a Kurtosis enclave, rolled by rolloor
        run: ./examples/kurtosis/run.sh
      - name: rolloor and kurtosis logs
        if: always()
        run: |
          cat /tmp/rolloor-kurtosis/rolloor.log || true
          tail -50 /tmp/rolloor-kurtosis/kurtosis.log || true
